name: Real slicer fixtures

# Slices print-forge's own models with the OrcaSlicer command line for the P1S, A1 and A1 mini
# and checks that the result matches the committed fixtures in tests/fixtures/real/ (apart
# from the slicing date in the G-code header). The sliced files and their provenance are
# uploaded as an artifact; to change the fixtures, download it and commit its contents.
# OrcaSlicer (AGPL-3.0) is only run here as a tool; nothing of it is vendored.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tests/fixtures/real/**"
      - ".github/workflows/real-fixtures.yml"
  pull_request:
    paths:
      - "tests/fixtures/real/**"
      - ".github/workflows/real-fixtures.yml"

permissions:
  contents: read

env:
  ORCA_VERSION: "2.4.2"
  ORCA_URL: https://github.com/SoftFever/OrcaSlicer/releases/download/v2.4.2/OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.4.2.AppImage
  ORCA_SHA256: d12fb8c8eac1aecd2dfb6377acd48f994f8fa439ed5292fa532dd82880f029fd
  PRINT_FORGE_TAG: v0.2.0

jobs:
  slice:
    name: slice with OrcaSlicer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install gcode-insight and print-forge ${{ env.PRINT_FORGE_TAG }}
        run: |
          python -m pip install -e .
          python -m pip install "print-forge @ git+https://github.com/projectbin07-stack/print-forge@${PRINT_FORGE_TAG}"
      - name: Download OrcaSlicer ${{ env.ORCA_VERSION }} and check its SHA-256
        run: |
          curl -fsSL -o orca.AppImage "$ORCA_URL"
          echo "$ORCA_SHA256  orca.AppImage" | sha256sum -c -
          chmod +x orca.AppImage
          ./orca.AppImage --appimage-extract > /dev/null
          ls squashfs-root
      - name: Install the libraries OrcaSlicer links against
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libgtk-3-0t64 libwebkit2gtk-4.1-0 libgl1 libegl1 libglu1-mesa \
            libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 libsecret-1-0 xvfb
      - name: Slice the fixtures
        run: |
          mkdir -p out
          xvfb-run -a python tests/fixtures/real/slice_fixtures.py \
            --orca squashfs-root/AppRun \
            --profiles squashfs-root/resources/profiles/BBL \
            --out out --orca-url "$ORCA_URL" --orca-sha256 "$ORCA_SHA256" \
            --print-forge "$PRINT_FORGE_TAG" --runner "$ImageOS $ImageVersion"
      - uses: actions/upload-artifact@v7
        with:
          name: real-fixtures
          path: out/
      - name: Compare with the committed fixtures
        run: python tests/fixtures/real/slice_fixtures.py --check out
      - name: Analyse every fixture
        run: |
          for f in out/*.gcode.3mf; do gcode-insight analyze "$f" | head -32; done
