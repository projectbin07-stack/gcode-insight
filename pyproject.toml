[build-system]
requires = ["hatchling>=1.21,<2"]
build-backend = "hatchling.build"

[project]
name = "gcode-insight"
dynamic = ["version"]
description = "Analyse FDM G-code files without a printer: filament, time, layers and cost."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Navaneeth KG" }]
keywords = ["gcode", "3d-printing", "fdm", "bambu-lab", "orcaslicer", "prusaslicer", "marlin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Printing",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<3",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
]

[project.scripts]
gcode-insight = "gcode_insight.cli:main"

[project.urls]
Homepage = "https://github.com/projectbin07-stack/gcode-insight"
Issues = "https://github.com/projectbin07-stack/gcode-insight/issues"
Changelog = "https://github.com/projectbin07-stack/gcode-insight/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/gcode_insight/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gcode_insight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
mypy_path = ["src", "tests"]
explicit_package_bases = true

[tool.coverage.run]
source = ["gcode_insight"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]
